apiVersion: trimtab.dev/v1alpha1
kind: Intent
metadata:
  name: license
spec:
  claim: "The demo repository has a license."
  scope:
    targets:
      - github.repo:ericcrosson-bitgo/trimtab-demo
  sense:
    demonstration:
      run: "test -s LICENSE"
    every: 6h
    timeout: 5m
  remedy:
    change:
      author:
        agent:
          template:
            prompt: prompts/license.md
        allowedPaths:
          - LICENSE
      reviewer:
        harness: goose
      rounds: 2
      attempts: 1
      branchPrefix: trimtab/team/
      timeout: 45m
      settle: 2h
  budget:
    inFlight: 1
    open: 1
